name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import project
        run: godot --headless --import

      - name: Run tests
        run: godot --headless --script res://tests/run_tests.gd

      - name: Network test (host and client over localhost)
        run: tests/net_test.sh godot

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Society server tests
        run: |
          cd server
          python -m venv .venv
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest -q tests

      - name: Society test (game client against a local server)
        run: tests/society_test.sh godot
