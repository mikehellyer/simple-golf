name: Release

# A v* tag builds every platform and publishes a GitHub release. Running the
# workflow by hand (Actions → Release → Run workflow) builds the same
# installers as downloadable artifacts without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "project.godot version $version does not match tag ${{ github.ref_name }}"
            exit 1
          fi

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import and test
        run: |
          godot --headless --import
          godot --headless --script res://tests/run_tests.gd

      - name: Export
        run: |
          mkdir -p build/linux build/windows build/macos
          godot --headless --export-release "Linux" build/linux/simple-golf.x86_64
          godot --headless --export-release "Windows" build/windows/Simple-Golf.exe
          godot --headless --export-release "macOS" build/macos/Simple-Golf.zip
          ls -laR build

      - uses: actions/upload-artifact@v5
        with:
          name: exports
          path: build/
          if-no-files-found: error

  package:
    needs: export
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: exports
          path: build/

      - name: Package (.deb and .tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          bash packaging/linux/build-deb.sh
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          chmod +x build/linux/simple-golf.x86_64
          tar -C build/linux -czf "dist/simple-golf-${version}-linux-x86_64.tar.gz" simple-golf.x86_64

      - name: Package (.dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          bash packaging/macos/build-dmg.sh

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      # Code signing (SignPath Foundation; see CODE_SIGNING.md). It switches on
      # once the repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN exist; until then builds are simply unsigned. The
      # game exe is signed first, so the copy inside the installer is signed,
      # then the installer itself. Each request waits for manual approval.
      - name: Upload the game exe for signing
        id: unsigned-exe
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-exe
          path: build/windows/Simple-Golf.exe
          if-no-files-found: error

      - name: Sign the game exe
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'simple-golf' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/windows-signed

      - name: Use the signed game exe
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: Copy-Item build\windows-signed\Simple-Golf.exe build\windows\Simple-Golf.exe -Force

      - name: Package (Windows installer and portable zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path project.godot -Pattern '^config/version="(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "packaging\windows\installer.iss"
          Compress-Archive -Path build\windows\Simple-Golf.exe, build\windows\Simple-Golf.pck -DestinationPath "dist\Simple-Golf-$version-Windows-portable.zip"
          # Stage the installer under a fixed name for its signing configuration.
          New-Item -ItemType Directory -Force signing | Out-Null
          Copy-Item "dist\Simple-Golf-$version-Windows-Setup.exe" signing\Simple-Golf-Setup.exe

      - name: Upload the installer for signing
        id: unsigned-installer
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-installer
          path: signing/Simple-Golf-Setup.exe
          if-no-files-found: error

      - name: Sign the installer
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'simple-golf' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/signed

      - name: Use the signed installer and check both signatures
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $version = (Select-String -Path project.godot -Pattern '^config/version="(.*)"').Matches[0].Groups[1].Value
          $setup = "dist\Simple-Golf-$version-Windows-Setup.exe"
          Copy-Item signing\signed\Simple-Golf-Setup.exe $setup -Force
          foreach ($file in @($setup, "build\windows\Simple-Golf.exe")) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$file : $($sig.Status) — $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$file is not validly signed" }
          }

      - uses: actions/upload-artifact@v5
        with:
          name: simple-golf-${{ runner.os }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: simple-golf-*
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
